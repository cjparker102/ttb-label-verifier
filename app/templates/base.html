<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TTB Label Verifier</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <p class="site-name">TTB Label Verifier</p>
    </div>
  </header>
  <main id="main" class="wrap">
    {% block main %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>Prototype. Not an official TTB or U.S. government website. This app checks label pictures in memory and never saves them; they are sent to the AI provider to be read.</p>
    </div>
  </footer>
</body>
</html>
