[project]
name = "ttb-label-verifier"
version = "0.1.0"
description = "Checks alcohol label images against their application data and TTB labeling rules."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "fastapi>=0.147.0",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
    "xlsxwriter>=3.2.9",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
